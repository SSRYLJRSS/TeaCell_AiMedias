name: distribution-dependencies

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: dependencies (${{ matrix.target }})
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build meson nasm pkg-config zip
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja meson nasm pkg-config
      - name: Install Windows media build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make nasm diffutils perl
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-meson
      - name: Verify and extract corresponding source
        run: node scripts/prepare-distribution-sources.mjs artifacts/dependency-inputs
      - name: Select supported CMake for upstream codec sources
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 3.31.6
      - name: Select Windows MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Record native CMake path
        if: runner.os != 'Windows'
        shell: bash
        run: echo "CMAKE_COMMAND=$(command -v cmake)" >> "$GITHUB_ENV"
      - name: Record Windows CMake path
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CMAKE_COMMAND=$((Get-Command cmake.exe).Source.Replace(''\'', ''/''))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - name: Build native HEIF static libraries
        run: node scripts/build-distribution-heif.mjs artifacts/dependency-inputs artifacts/dependency-build
      - name: Build local-file FFmpeg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-distribution-ffmpeg.sh artifacts/dependency-inputs artifacts/dependency-build
      - name: Build local-file FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-distribution-ffmpeg.sh artifacts/dependency-inputs artifacts/dependency-build
      - name: Collect binaries, exact sources and build evidence
        run: node scripts/verify-distribution-media.mjs artifacts/dependency-build
      - name: Archive binaries and source evidence
        run: node scripts/collect-distribution-dependencies.mjs ${{ matrix.target }} artifacts/dependency-inputs artifacts/dependency-build artifacts/dependencies-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: dependencies-${{ matrix.target }}
          path: artifacts/dependencies-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed configuration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-failure-${{ matrix.target }}
          path: |
            artifacts/dependency-inputs/sources/FFmpeg-*/ffbuild/config.log
            artifacts/dependency-build/build-*/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
