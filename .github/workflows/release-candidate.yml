name: release-candidate

on:
  workflow_dispatch:

jobs:
  bundle:
    name: bundle (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libasound2-dev unzip
      - run: npm ci
      - run: npm run prepare-media-tools -- --target ${{ matrix.target }}
      - run: npm run desktop:check:strict -- --target ${{ matrix.target }}
      - name: Build bundle
        run: npm run desktop:build -- --target ${{ matrix.target }}
      - name: Collect installers and license notices
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          out="artifacts/${{ matrix.target }}"
          mkdir -p "$out"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc) find "$bundle" -type f \( -name '*.exe' -o -name '*.msi' \) -exec cp {} "$out"/ \; ;;
            aarch64-apple-darwin) find "$bundle" -type f -name '*.dmg' -exec cp {} "$out"/ \; ;;
            x86_64-unknown-linux-gnu) find "$bundle" -type f \( -name '*.AppImage' -o -name '*.deb' \) -exec cp {} "$out"/ \; ;;
          esac
          test -n "$(find "$out" -type f | head -n 1)"
          license_source="src-tauri/binaries/licenses/$target"
          test -d "$license_source"
          mkdir -p "$out/licenses"
          cp -R "$license_source" "$out/licenses/$target"
          printf '{"schemaVersion":1,"target":"%s","version":"%s","commit":"%s"}\n' "$target" "$(node -p "require('./package.json').version")" "${GITHUB_SHA}" > "$out/build-manifest.json"
          (cd "$out" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: bagertea-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}
          if-no-files-found: error

  verify:
    needs: bundle
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify artifacts, license notices, version and commit
        run: |
          node --input-type=commonjs <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          if ('${{ needs.bundle.result }}' !== 'success') throw new Error('至少一个平台的候选构建失败');
          const expectedVersion = require('./package.json').version;
          const expectedCommit = process.env.GITHUB_SHA;
          const targets = [
            'x86_64-pc-windows-msvc',
            'aarch64-apple-darwin',
            'x86_64-unknown-linux-gnu',
          ];
          const mediaManifest = JSON.parse(fs.readFileSync('src-tauri/binaries/manifest.json', 'utf8'));
          const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');

          for (const target of targets) {
            const dir = path.join('artifacts', `bagertea-${target}`);
            const build = JSON.parse(fs.readFileSync(path.join(dir, 'build-manifest.json'), 'utf8'));
            if (build.target !== target || build.version !== expectedVersion || build.commit !== expectedCommit) {
              throw new Error(`版本/提交/目标不一致: ${target}`);
            }

            const licenseName = mediaManifest.targets[target]?.licenseFileName ?? 'LICENSE.txt';
            const license = path.join(dir, 'licenses', target, licenseName);
            const expectedLicenseHash = mediaManifest.targets[target]?.licenseSha256;
            if (!fs.existsSync(license) || digest(license) !== expectedLicenseHash) {
              throw new Error(`许可证材料缺失或摘要不匹配: ${target}`);
            }

            const checksumFile = path.join(dir, 'SHA256SUMS.txt');
            const checksumRows = fs.readFileSync(checksumFile, 'utf8').trim().split(/\r?\n/);
            if (checksumRows.length === 0) throw new Error(`校验清单为空: ${target}`);
            for (const row of checksumRows) {
              const match = row.match(/^([a-f0-9]{64})  (.+)$/i);
              if (!match) throw new Error(`校验清单格式无效: ${target}`);
              const file = path.resolve(dir, match[2]);
              if (!file.startsWith(path.resolve(dir) + path.sep) || digest(file) !== match[1]) {
                throw new Error(`候选文件校验失败: ${target}/${match[2]}`);
              }
            }
          }
          console.log('三个平台的版本、提交、目标、安装包摘要与许可证材料一致；仍须完成人工 UAT 和 FFmpeg 对应源代码/再分发审查，方可交付测试者。');
          NODE
