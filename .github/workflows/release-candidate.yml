name: release-candidate

on:
  workflow_dispatch:
    inputs:
      rebuildMacHeifOnly:
        description: Rebuild macOS HEIF with only the declared static codec dependencies
        type: boolean
        default: false
      buildDependenciesOnly:
        description: Build hash-pinned native programs and their corresponding source before installers
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mac-heif:
    if: ${{ inputs.rebuildMacHeifOnly }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: brew install ninja
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 3.31.6
      - run: node scripts/prepare-distribution-sources.mjs artifacts/dependency-inputs
      - run: node scripts/build-distribution-heif.mjs artifacts/dependency-inputs artifacts/dependency-build
      - run: node scripts/collect-distribution-dependencies.mjs aarch64-apple-darwin artifacts/dependency-inputs artifacts/dependency-build artifacts/mac-heif --heif-only
      - uses: actions/upload-artifact@v7
        with:
          name: mac-heif
          path: artifacts/mac-heif/
          retention-days: 14
  dependencies:
    if: ${{ inputs.buildDependenciesOnly && !inputs.rebuildMacHeifOnly }}
    uses: ./.github/workflows/distribution-dependencies.yml
  bundle:
    if: ${{ !inputs.buildDependenciesOnly && !inputs.rebuildMacHeifOnly }}
    name: bundle (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Log and assert native runner, Rust, and Node target
        run: node scripts/build-environment.mjs --target ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev libxdo-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libasound2-dev libclang-dev unzip
      - run: npm ci
      - name: Prepare pinned target HEIF libraries and licenses
        run: npm run prepare-heif-libraries -- --target ${{ matrix.target }}
      - name: Prepare pinned media sidecars
        run: npm run prepare-media-tools -- --target ${{ matrix.target }}
      - name: Require sidecar hashes, encoders, and app version agreement
        run: npm run desktop:check:strict -- --target ${{ matrix.target }}
      - name: Build native installer
        env:
          CANDIDATE_BUILD_LOG: ${{ runner.temp }}/teacell-build-${{ matrix.target }}.log
        run: npm run desktop:build -- --target ${{ matrix.target }}
      - name: Collect test candidate and hashes
        shell: bash
        env:
          BUILD_COMMIT: ${{ github.sha }}
          CANDIDATE_BUILD_LOG: ${{ runner.temp }}/teacell-build-${{ matrix.target }}.log
        run: >-
          node scripts/collect-candidate.mjs
          --target '${{ matrix.target }}'
          --commit "$BUILD_COMMIT"
          --out 'artifacts/${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: teacell-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: bundle
    if: ${{ always() && !inputs.buildDependenciesOnly && !inputs.rebuildMacHeifOnly }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any platform bundle failed
        if: needs.bundle.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test candidate contract verifier
        run: npm run test:tooling
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Verify shared version, commit, license notice, and checksums
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/verify-candidates.mjs artifacts "$BUILD_COMMIT"
