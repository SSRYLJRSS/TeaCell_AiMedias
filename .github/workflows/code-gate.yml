name: code-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  rust:
    name: rust (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            node_os: win32
            node_arch: x64
            machine: x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            node_os: darwin
            node_arch: arm64
            machine: arm64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            node_os: linux
            node_arch: x64
            machine: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert runner target
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV | grep -F "host: ${{ matrix.target }}"
          test "$(node -p process.platform)" = "${{ matrix.node_os }}"
          test "$(node -p process.arch)" = "${{ matrix.node_arch }}"
          test "$(uname -m)" = "${{ matrix.machine }}"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libasound2-dev
      - run: npm ci
      - run: npm run build
      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-features --target ${{ matrix.target }}
      - name: Native Tauri build
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }} --bin bagertea_ai_media_v2
      - name: Desktop environment check
        run: node scripts/desktop.mjs check --target ${{ matrix.target }}
