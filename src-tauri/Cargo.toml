[package]
name = "teacell_ai_media_manager"
version = "1.0.2"
edition = "2021"
description = "茶馆AI素材管理 / TeaCell AI Media Manager — 本地优先的图片与视频素材库 / Local-first photo and video library"

[lib]
name = "bagertea_ai_media_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Phase 2 F02：编译 msvc_stl_shim.cpp（补 heif.lib 缺失的 STL 符号）
cc = "1"
sha2 = "0.10"
serde_json = "1"

[dependencies]
# ── 依赖分批：T01 核心集；T02 数据层（rusqlite/sha2/walkdir/dirs/chrono/uuid，本批）；
#    T03 加 image（本批）；ffmpeg 改走 PATH 探测 + 优雅降级（sidecar 分发留到打包阶段）；
#    kamadak-exif 曾弃用于缩略图；v2.5 重新引入做 EXIF 元信息提取（PRD 5.5）；T05 加 reqwest/ort
tauri = { version = "2", features = ["protocol-asset"] }
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite", "functions"] }
sha2 = "0.10"
walkdir = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 异步运行时由 tauri::async_runtime 提供（内部自带 tokio），无需直接依赖 tokio
thiserror = "1"
kamadak-exif = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# W0-9：日志落文件（发布版 windows_subsystem="windows" 无控制台，stdout 日志不可见）
tracing-appender = "0.2"
# 日志系统 F10：一键诊断包把日志和脱敏环境摘要打成 zip
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# W0-10：迁移失败需在 tauri app 启动前弹原生 dialog（plugin dialog 需要 AppHandle；
# 版本与 tauri-plugin-dialog 2.7 传递依赖一致，避免双份 rfd）。关闭默认 xdg-portal，
# 使 Linux 与 tauri-plugin-dialog 使用同一 GTK3 后端，避免启用两个互斥后端。
rfd = { version = "0.16", default-features = false }
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "tga"] }
# T05a 云端 AI 打标：blocking 与现有同步 command 风格一致（避免跨 await 持 DB 锁）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
# Phase 2 F04：RAW 真解码（darktable 系纯 Rust 解析器；API 不守 SemVer，锁精确版本）
rawler = "=0.7.2"
# Phase 2 F02：HEIC/HEIF 解码（预编译静态链接 libheif+libde265，免 vcpkg；
# Apache-2.0 封装；libheif 本体 LGPL-3 静态链接——闭源分发合规见 docs/ARCHITECTURE.md）
heif-rs = "26.7"
kmeans_colors = "=0.6"
palette = "=0.7"

# 指导书 §6.3 / 三端复核 B3：API Key 系统凭据存储（service/username 见 credentials.rs）。
# 按目标 OS 精确选择原生后端，禁用默认 feature 避免误带 mock 进 production。
# 不能用 cfg(unix) 代替 linux（会命中 macOS）。feature 名对应 keyring 3.6.3。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

# 开发期性能：图像/解码相关 crate 在 dev 下也按 O3 编译
# （debug 构建下 24MP JPEG 全解码 12.7s → O3 后亚秒级，老板走查体感关键）
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.kamadak-exif]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rawler]
opt-level = 3
# FB2-08：k-means 提色 + Lab 色空间转换（新增图像相关 crate，按铁律 3.3 加 O3）
[profile.dev.package.kmeans_colors]
opt-level = 3
[profile.dev.package.palette]
opt-level = 3
