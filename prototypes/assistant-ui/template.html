lor-border);padding:20px;overflow:auto;display:flex;flex-direction:column;gap:16px;background:var(--color-surface)}.workbench>header{display:flex;align-items:center;justify-content:space-between}.preview{min-height:220px;background:var(--color-bg);display:grid;place-items:center;border:1px solid var(--color-border);border-radius:var(--radius-item);color:var(--color-text-secondary)}.preview-shape{width:70%;height:120px;background:var(--color-surface-hover);display:grid;place-items:center}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px}.field select,.field input{width:100%}.list{display:flex;flex-direction:column;gap:8px}.file-row{display:flex;gap:10px;padding:10px;background:var(--color-surface-raised);align-items:center;border-radius:var(--radius-item)}.file-row span{flex:1}.plan{border-left:3px solid var(--color-status);padding:12px;background:var(--color-surface-raised);display:flex;flex-direction:column;gap:10px;line-height:1.7}.plan ol{margin:0;padding-left:20px}.bottom{border-top:1px solid var(--color-border);display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);align-items:center;gap:8px;padding:0 22px}.nav-side{display:flex;gap:18px;overflow:auto;scrollbar-width:thin;align-items:center}.nav-left{justify-content:flex-end}.bottom button{border:0;background:transparent}.bottom button.active{border-bottom:2px solid var(--color-status);border-radius:0;font-weight:600}.logo{width:48px;height:46px;justify-self:center;padding:4px!important}.logo img{width:34px;height:34px}.page{flex:1;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:18px}.page.narrow{max-width:920px;margin:auto;width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.asset{background:var(--color-surface);padding:14px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;border-radius:var(--radius-item)}.floating-logo{position:absolute;right:8 <body>
<section class="demo"><strong>A0-06 交互原型</strong><p>验证切页和切对话后工作是否保留、右侧审核是否挤压聊天。所有数据仅在内存，未连接素材库。</p><button id="theme">切换深色</button><button id="guide">首次引导</button><button id="app-mode">全窗口验证</button><details><summary>演示路径与当前状态</summary><div class="scenario"><button data-scenario="handoff">① 入库交给助手</button><button data-scenario="switch">② 切换对话保留草稿</button><button data-scenario="floating">③ 素材库继续说话</button><button data-scenario="queue">④ 已有任务时排队</button></div><div id="walkthrough"></div><div id="debug" class="debug"></div></details></section>
<main class="window" id="window"><header class="top"><div class="status" tabindex="0" aria-label="工作状态，悬停或聚焦暂停轮播" id="status"></div><button data-nav="settings">设置</button><div class="title">茶馆 AI 素材管理</div><button class="badge" id="show-demo">交互原型</button></header><div class="workspace" id="workspace"></div><nav class="bottom" aria-label="主导航"><div class="nav-side nav-left" id="nav-left"></div><button class="logo" id="home" aria-label="返回助手"><img src="__LOGO__" alt="茶馆"></button><div class="nav-side" id="nav-right"></div></nav><div id="floating"></div><div id="toast" class="toast" hidden role="status"></div></main>
<dialog id="dialog"><div class="body" id="dialog-body"></div><footer id="dialog-footer"></footer></dialog>
<script>
'use strict';
const assets=[{id:1,name:'山间清晨.jpg'},{id:2,name:'旅行 02.jpg'},{id:3,name:'产品 01.jpg'},{id:4,name:'自然 03.jpg'}];
const Model=(()=>{
  const empty=(id,title)=>({id,title,archived:false,messages:[],attachments:[],workbench:'preview',collection:'默认分库',rename:false,plan:null,view:'single',draft:'',review:{index:0,tags:['旅行、自然、风景','自然、树林'],confirmed:false}});
  const initial=()=>({page:'assistant',active:1,recent:1,nextId:3,conversations:[empty(1,'新对话'),empty(2,'昨天的素材整理')],tasks:[],service:'演示服务 · 演示模型',floatEnabled:true,floatOpen:false,floatSide:'right',floatY:46,history:true,nav:['import','library','tagging','toolbox'],width:380,standalone:{attachments:['照片 01.jpg','照片 02.jpg'],collection:'旅行素材',rename:true},resultFilter:false,query:'',showArchived:false,notice:'',step:0});
  function reduce(previous,action){
    const s=structuredClone(previous);const c=s.conversations.find(v=>v.id===s.active);
    switch(action.type){
      case 'nav':s.page=action.page;s.floatOpen=false;break;
      case 'new':{const n=empty(s.nextId++,'新对话');s.conversations.unshift(n);s.active=n.id;s.recent=n.id;break;}
      case 'select':s.active=action.id;s.recent=action.id;s.conversations.sort((a,b)=>a.id===action.id?-1:b.id===action.id?1:0);break;
      case 'history':s.history=!s.history;break;
      case 'search':s.query=action.text;break;
      case 'draft':c.draft=action.text;break;
      case 'send':if(action.text.trim()){c.messages.push({role:'user',text:action.text},{role:'assistant',text:'已收到。你可以在右侧检查清单、分库与改名设置，再查看具体计划。'});c.draft='';if(c.title==='新对话')c.title=action.text.slice(0,18);}break;
      case 'attach':c.attachments.push(...action.names);if(c.plan&&!c.plan.approved){c.plan=null;if(c.workbench==='plan')c.workbench='import';}s.notice='已添加为附件，尚未入库或发送图片。';break;
      case 'service':s.service=action.value;if(c.plan&&!c.plan.approved){c.plan=null;if(c.workbench==='plan')c.workbench='import';s.notice='服务已改变，请重新检查计划。';}break;
      case 'import':c.workbench='import';s.width=480;break;
      case 'collection':if(s.page==='import'){s.standalone.collection=action.value;s.standalone.plan=null;}else{c.collection=action.value;c.plan=null;}break;
      case 'rename-option':if(s.page==='import'){s.standalone.rename=action.value;s.standalone.plan=null;}else{c.rename=action.value;c.plan=null;}break;
      case 'prepare':if(c.attachments.length){c.plan={count:c.attachments.length,collection:c.collection,rename:c.rename,service:s.service,approved:false};c.workbench='plan';s.width=480;}else s.notice='请先选择或拖入文件。';break;
      case 'approve':if(c.plan&&!c.plan.approved){c.plan.approved=true;const busy=s.tasks.some(t=>t.status==='执行中');s.tasks.push({id:s.tasks.length+1,conversation:c.id,title:'导入并生成标签建议',status:busy?'等待执行':'执行中',done:0,total:c.plan.count});s.notice=busy?'任务已排队；聊天和浏览仍可使用。':'计划已确认，演示任务开始。';c.workbench='progress';}break;
      case 'advance':{const t=s.tasks.find(t=>t.status==='执行中');if(t){t.done=Math.min(t.total,t.done+1);if(t.done===t.total){t.status='已完成';const next=s.tasks.find(v=>v.status==='等待执行');if(next)next.status='执行中';}}break;}
      case 'cancel':{const t=s.tasks.find(t=>t.id===action.id);if(t){t.status='已取消';const next=s.tasks.find(v=>v.status==='等待执行');if(!s.tasks.some(v=>v.status==='执行中')&&next)next.status='执行中';}break;}
      case 'stop-reasoning':s.notice='已停止回答，已提交的业务任务继续。';break;
      case 'handoff':{if(s.standalone.plan?.approved){s.notice='清单已有导入任务，请查看原任务，避免重复提交。';break;}const occupied=c.attachments.length||c.plan||c.draft||c.messages.length||c.selection?.length||s.tasks.some(t=>t.conversation===c.id);if(occupied&&!action.newConversation){s.notice='当前对话已有工作，请明确选择新对话接收清单。';break;}let target=c;if(action.newConversation){target=empty(s.nextId++,'入库清单');s.conversations.unshift(target);s.active=target.id;s.recent=target.id;}target.attachments=[...s.standalone.attachments];target.collection=s.standalone.collection;target.rename=s.standalone.rename;target.workbench='import';s.page='assistant';s.width=480;s.notice='已带入清单和设置，原对话工作保留，尚未提交任务。';break;}
      case 'search-assets':c.searchResults=[1,3];c.workbench='search';break;
      case 'view-search':s.page='library';s.resultFilter={ids:[...(c.searchResults||[])],kind:'search'};s.librarySelection=[];break;
      case 'select-asset':{const ids=s.librarySelection||[];s.librarySelection=ids.includes(action.id)?ids.filter(id=>id!==action.id):[...ids,action.id];break;}
      case 'library-handoff':{if(!s.librarySelection?.length){s.notice='请先选择素材。';break;}const target=empty(s.nextId++,'已选素材');target.selection=[...s.librarySelection];target.messages.push({role:'assistant',text:'已带入固定的素材选择，可继续描述任务；原对话和库中后续选择不会改变这次清单。'});s.conversations.unshift(target);s.active=target.id;s.recent=target.id;s.page='assistant';break;}
      case 'tagging':c.workbench='tagging';s.width=480;break;
      case 'view':c.view=action.value;break;
      case 'result':{s.page='library';const task=s.tasks.filter(t=>t.conversation===c.id).at(-1);s.resultFilter={ids:assets.slice(0,task?.done||0).map(a=>a.id),taskId:task?.id,kind:'task'};s.librarySelection=[];break;}
      case 'exit-result':s.resultFilter=false;break;
      case 'toggle-float':s.floatEnabled=action.value;s.floatOpen=false;break;
      case 'float-open':s.active=s.recent;s.floatOpen=!s.floatOpen;break;
      case 'review':s.page='assistant';s.floatOpen=false;s.width=480;break;
      case 'float-position':s.floatSide=action.side;s.floatY=action.y;break;
      case 'width':s.width=Math.max(280,Math.min(650,action.value));break;
      case 'toggle-nav':s.nav=s.nav.includes(action.key)?s.nav.filter(k=>k!==action.key):[...s.nav,action.key];break;
      case 'move-nav':{const left=['import','library','settings'];const group=s.nav.filter(k=>left.includes(k)===left.includes(action.key));const index=group.indexOf(action.key);const other=group[index+action.direction];if(other){const a=s.nav.indexOf(action.key),b=s.nav.indexOf(other);[s.nav[a],s.nav[b]]=[s.nav[b],s.nav[a]];}break;}
      case 'rename-chat':c.title=action.title||c.title;break;
      case 'archive':c.archived=!c.archived;s.notice=c.archived?'对话已归档，可切换查看归档。':'对话已恢复。';break;
      case 'show-archive':s.showArchived=!s.showArchived;break;
      case 'delete-chat':if(s.tasks.some(t=>t.conversation===c.id&&!['已完成','已取消'].includes(t.status))){s.notice='此对话还有任务，请先处理任务。';break;}s.conversations=s.conversations.filter(v=>v.id!==c.id);if(!s.conversations.length)s.conversations.push(empty(s.nextId++,'新对话'));s.active=s.conversations[0].id;s.recent=s.active;break;
      case 'notice':s.notice=action.text;break;
      case 'tag-edit':c.review.tags[c.review.index]=action.value;c.review.confirmed=false;break;
      case 'tag-next':c.review.index=(c.review.index+1)%c.review.tags.length;break;
      case 'confirm-tags':c.review.confirmed=true;s.notice='已确认演示标签，未写入正式素材库。';break;
      case 'manual-plan':s.standalone.plan={approved:false};break;
      case 'manual-approve':if(s.standalone.plan&&!s.standalone.plan.approved){s.standalone.plan.approved=true;s.tasks.push({id:s.tasks.length+1,conversation:null,title:'手动导入',status:s.tasks.some(t=>t.status==='执行中')?'等待执行':'执行中',done:0,total:s.standalone.attachments.length});s.notice='手动导入已受理，没有自动加入任何对话。';}break;
    }
    return s;
  }
  return {initial,reduce};
})();
let state=Model.initial();const $=id=>document.getElementById(id);const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const walkthroughs={
  handoff:[['打开独立入库',{type:'nav',page:'import'}],['把清单交给助手',{type:'handoff'}],['查看整段计划',{type:'prepare'}],['确认演示任务',{type:'approve'}]],
  switch:[['给旧对话添加附件',{type:'attach',names:['旧对话附件.jpg']}],['打开旧对话工作台',{type:'import'}],['新建空白对话',{type:'new'}],['切回旧对话，检查附件',{type:'select',id:1}]],
  floating:[['添加演示照片',{type:'attach',names:['照片.jpg']}],['形成待审核计划',{type:'prepare'}],['切到素材库',{type:'nav',page:'library'}],['打开悬浮助手',{type:'float-open'}],['转到完整页审核',{type:'review'}]],
  queue:[['添加第一批',{type:'attach',names:['第一批.jpg']}],['准备第一批',{type:'prepare'}],['受理第一批',{type:'approve'}],['另开对话',{type:'new'}],['添加第二批',{type:'attach',names:['第二批.jpg']}],['准备第二批',{type:'prepare'}],['受理后检查等待执行',{type:'approve'}]],
};let selectedWalkthrough=null;let walkthroughIndex=0;
const current=()=>state.conversations.find(c=>c.id===state.active);let toastTimer;let statusIndex=0;let statusPaused=false;let guideIndex=0;let lastFocus;
function dispatch(action){state=Model.reduce(state,action);render();}
const filesMarkup=names=>names.map(name=>`<div class="file-row"><span>${escape(name)}</span><small>待处理</small></div>`).join('');
function fields(draft){return `<label class="field">目标分库<select id="collection">${['默认分库','旅行素材','产品素材'].map(n=>`<option ${draft.collection===n?'selected':''}>${n}</option>`).join('')}</select></label><label><input id="rename-option" type="checkbox" ${draft.rename?'checked':''}> 按分库规则改名</label>`;}
function workbench(c){let body='';
  if(c.workbench==='search')body=`<p>演示搜索：${c.searchResults?.length||0} 个固定素材结果</p>${filesMarkup(assets.filter(a=>c.searchResults?.includes(a.id)).map(a=>a.name))}<button data-action="view-search" class="primary">在素材库查看</button>`;
  if(c.workbench==='preview')body=`${c.selection?.length?`<p>固定已选素材：${assets.filter(a=>c.selection.includes(a.id)).map(a=>a.name).join('、')}</p>`:''}<button data-action="search-assets">演示：搜索山间或产品素材</button><div class="row"><button data-action="single">单图</button><button data-action="list">列表</button></div>${c.view==='list'?filesMarkup(c.attachments.length?c.attachments:['演示素材 A','演示素材 B']):'<div class="preview"><div class="preview-shape">素材预览</div></div>'}<p class="muted">选择素材后在这里预览。</p>`;
  if(c.workbench==='import')body=`<p>${c.attachments.length} 个附件 · 尚未入库</p><div class="list">${filesMarkup(c.attachments)}</div>${fields(c)}<button class="primary" data-action="prepare">查看具体计划</button>`;
  if(c.workbench==='plan')body=`<div class="plan"><strong>导入与打标计划</strong><ol><li>复制 ${c.plan.count} 个文件到「${escape(c.plan.collection)}」。</li><li>${c.plan.rename?'按分库规则改名':'保留原文件名'}，保留库外原文件。</li><li>向「${escape(c.plan.service)}」发送压缩预览图，生成标签建议。</li></ol><p class="muted">正式标签仍需另行审核。</p><button class="primary" data-action="approve" ${c.plan.approved?'disabled':''}>确认执行整段计划</button><button data-action="import">返回修改</button></div>`;
  if(c.workbench==='progress'){const tasks=state.tasks.filter(t=>t.conversation===c.id);body=tasks.map(t=>`<div class="plan"><strong>${escape(t.title)}</strong><p>${t.status} · ${t.done}/${t.total}</p><progress value="${t.done}" max="${t.total}" style="width:100%"></progress>${['执行中','等待执行'].includes(t.status)?`<button data-cancel="${t.id}">取消任务</button>`:'<button data-action="result">在素材库查看</button>'}</div>`).join('')+'<div class="row"><button data-action="advance">演示：完成下一项</button><button data-action="tagging">审核标签建议</button></div>';}
  if(c.workbench==='tagging')body=`<div class="preview"><div class="preview-shape">演示照片 ${c.review.index+1} / ${c.review.tags.length}</div></div><label class="field">标签建议<input id="review-tags" value="${escape(c.review.tags[c.review.index])}" aria-label="编辑标签建议"></label><p>${c.review.confirmed?'演示标签已确认':'标签建议待确认'}</p><div class="row"><button data-action="tag-next">下一张</button><button data-action="confirm-tags" class="primary">批量确认标签</button><button data-nav="tagging">打开打标页面</button></div>`;
  return `<aside class="workbench" aria-label="助手右侧工作台"><header><h3>${({preview:'素材预览',search:'搜索结果',import:'导入工作台',plan:'计划审核',progress:'任务进度',tagging:'标签审核'})[c.workbench]}</h3><button data-action="preview">预览</button></header>${body}</aside>`;
}
function assistant(){const c=current();const visible=state.conversations.filter(v=>v.archived===state.showArchived&&v.title.includes(state.query));return `<aside class="history ${state.history?'':'hidden'}"><button data-action="new" class="primary">新建对话</button><input id="history-search" placeholder="搜索对话" aria-label="搜索对话" value="${escape(state.query)}"><div class="history-list">${visible.map(v=>`<div class="history-row"><button data-select="${v.id}" class="${c.id===v.id?'active':''}">${escape(v.title)}</button></div>`).join('')}</div><button data-action="show-archive">${state.showArchived?'查看最近对话':'查看归档'}</button></aside><section class="chat" aria-label="助手对话"><header class="chat-title"><div class="row"><button data-action="history" aria-label="显示或隐藏历史">☰</button><h2>${escape(c.title)}</h2></div><button data-action="chat-menu">对话管理</button></header><div class="messages">${c.messages.length?c.messages.map(m=>`<div class="message ${m.role}">${escape(m.text)}</div>`).join(''):`<div class="welcome"><img src="__LOGO__" alt=""><h2>今天想整理什么素材？</h2><p class="muted">导入、查找、整理，让茶馆帮你完成。</p><div class="suggestions"><button data-action="demo-attach">添加演示照片</button><button data-action="tagging">审核标签建议</button></div></div>`}</div>${c.attachments.length?`<div class="attachment"><span>附件 · ${c.attachments.length} 个文件</span><button data-action="import">导入</button></div>`:''}<form class="composer" id="composer"><textarea id="message" aria-label="向助手说话" placeholder="描述你的需求，或拖入文件…">${escape(c.draft)}</textarea><div class="composer-footer"><button type="button" data-action="pick">添加附件</button><select id="service" aria-label="当前服务与模型">${['演示服务 · 演示模型','本地服务 · 演示模型'].map(n=>`<option ${state.service===n?'selected':''}>${n}</option>`).join('')}</select><span class="spacer"></span><button type="button" data-action="stop-reasoning">停止回答</button><button type="submit" class="primary">发送</button></div></form></section><div class="separator" id="separator" role="separator" tabindex="0" aria-label="调整右侧工作台宽度" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="650" aria-valuenow="${state.width}"></div>${workbench(c)}`;}
function otherPage(){
  if(state.page==='import')return `<section class="page narrow"><h2>入库</h2><p class="muted">独立入库入口保留，与助手使用同一导入能力。</p><div class="list">${filesMarkup(state.standalone.attachments)}</div>${state.standalone.plan?.approved?'':fields(state.standalone)}<div class="row"><button data-action="handoff" class="primary">交给助手</button><button data-action="manual-import" ${state.standalone.plan?.approved?'disabled':''}>检查并导入</button></div>${state.standalone.plan?`<div class="plan"><strong>手动导入计划</strong><p>复制 ${state.standalone.attachments.length} 个文件到「${escape(state.standalone.collection)}」，${state.standalone.rename?'按规则改名':'保留原名'}，库外原文件保留。</p>${state.standalone.plan.approved?'<p>已受理，查看左上角工作状态。</p><button data-action="advance">演示：完成下一项</button>':'<button data-action="manual-approve" class="primary">确认手动导入</button>'}</div>`:''}</section>`;
  if(state.page==='library')return `<section class="page"><header class="row"><h2>素材库</h2>${state.resultFilter?`<span class="badge">${state.resultFilter.kind==='search'?'本次搜索结果':'本次任务结果'}</span><button data-action="exit-result">退出本次结果</button>`:''}<button data-action="review">返回助手</button><button data-action="library-handoff">将选中素材交给助手（新对话）</button></header><div class="grid">${assets.filter(a=>!state.resultFilter||state.resultFilter.ids.includes(a.id)).map(a=>`<article class="asset"><div class="preview-shape">${a.id}</div><label><input type="checkbox" data-asset="${a.id}" ${(state.librarySelection||[]).includes(a.id)?'checked':''}> ${a.name}</label></article>`).join('')}</div>${state.resultFilter&&state.resultFilter.ids.length===0?'<p>本次任务尚无成功结果。</p>':''}</section>`;
  if(state.page==='tagging')return `<section class="page narrow"><h2>打标</h2><p>集中审核同一批演示标签建议。</p><div class="preview"><div class="preview-shape">演示照片 ${current().review.index+1}</div></div><input id="review-tags" aria-label="集中审核标签" value="${escape(current().review.tags[current().review.index])}"><p>${current().review.confirmed?'演示标签已确认':'标签建议待确认'}</p><div class="row"><button data-action="tag-next">下一张</button><button data-action="confirm-tags">批量确认标签</button><button data-action="review">回到助手继续审核</button></div></section>`;
  if(state.page==='toolbox')return `<section class="page narrow"><h2>百宝箱</h2><p class="muted">插件功能尚未开放，计划在 2.5 提供。</p><p>这里将用于查看、管理和发现插件。</p></section>`;
  return `<section class="page narrow"><h2>设置</h2><label><input id="float-enabled" type="checkbox" ${state.floatEnabled?'checked':''}> 开启应用内悬浮助手</label><h3>底栏入口</h3><p class="muted">中央茶馆 Logo 始终保留。2.0 可从已有功能中添加入口。入库、素材库、设置在左侧；打标、百宝箱在右侧，可在各自一侧前移、后移。</p><div class="row">${['import','library','tagging','toolbox','settings'].map(k=>`<div><label><input type="checkbox" data-nav-toggle="${k}" ${state.nav.includes(k)?'checked':''}> ${labels[k]}</label>${state.nav.includes(k)?`<button id="nav-${k}-previous" data-nav-move="${k}" data-direction="-1" aria-label="${labels[k]}前移">前移</button><button id="nav-${k}-next" data-nav-move="${k}" data-direction="1" aria-label="${labels[k]}后移">后移</button>`:''}</div>`).join('')}</div><h3>模型服务</h3><label class="field">已配置服务<select><option>演示服务</option><option>本地服务</option></select></label><p class="muted">原型不连接服务，也不保存凭据。</p></section>`;
}
const labels={import:'入库',library:'素材库',tagging:'打标',toolbox:'百宝箱',settings:'设置'};
function render(){
  const focus=document.activeElement;const focusId=focus?.id;const selection=focus?.selectionStart;
  $('workspace').innerHTML=state.page==='assistant'?assistant():otherPage();
  $('workspace').style.setProperty('--workbench-width',state.width+'px');
  const navButton=k=>`<button data-nav="${k}" class="${state.page===k?'active':''}">${labels[k]}</button>`;
  $('nav-left').innerHTML=state.nav.filter(k=>['import','library','settings'].includes(k)).map(navButton).join('');
  $('nav-right').innerHTML=state.nav.filter(k=>!['import','library','settings'].includes(k)).map(navButton).join('');
  const c=current();$('floating').innerHTML=state.floatEnabled&&!(state.page==='assistant'&&c.workbench==='plan')?`<button id="float-logo" class="floating-logo" aria-label="继续最近对话" style="${state.floatSide==='left'?'left:8px;right:auto;':'right:8px;'}top:${state.floatY}%"><img src="__LOGO__" alt=""></button>${state.floatOpen?`<section class="floating-chat" aria-label="悬浮助手" style="${state.floatSide==='left'?'left:54px;right:auto;':''}"><header><strong>继续最近对话</strong><button data-action="float-new">新建</button><button data-action="float-close" aria-label="关闭悬浮聊天">×</button></header><div class="float-brief">${escape(c.messages.at(-1)?.text||'有什么需要茶馆帮忙的？')}</div>${c.plan&&!c.plan.approved?'<div class="plan">待审核导入计划<button data-action="review" class="primary">查看并确认</button></div>':''}<textarea id="float-message" aria-label="悬浮助手输入" placeholder="继续说话…"></textarea><button data-action="float-send">发送</button><button data-action="review">打开完整助手</button></section>`:''}`:'';
  $('toast').hidden=!state.notice;$('toast').textContent=state.notice;clearTimeout(toastTimer);if(state.notice)toastTimer=setTimeout(()=>{$('toast').hidden=true;},4000);
  $('debug').textContent=`页面：${state.page} · 当前对话：${c.id}「${c.title}」 · 附件：${c.attachments.length} · 右栏：${c.workbench} · 宽度：${state.width}px · 计划：${c.plan?(c.plan.approved?'已批准':'待审核'):'无'} · 任务：${state.tasks.map(t=>`${t.id}:${t.status}(${t.done}/${t.total})`).join('，')||'无'} · 悬浮助手：${state.floatEnabled?'开启':'关闭'}`;
  if(selectedWalkthrough){const steps=walkthroughs[selectedWalkthrough];$('walkthrough').innerHTML=walkthroughIndex<steps.length?`<p>第 ${walkthroughIndex+1}/${steps.length} 步：观察操作后当前对话、附件与任务是否一致。</p><button data-action="walk-next">${steps[walkthroughIndex][0]}</button>`:'<p>路径完成。可自由操作，或选择另一条路径重置演示数据。</p>';}
  renderStatus();bindResize();bindFloat();
  applyLayout();
  if(focusId&&$(focusId)){ $(focusId).focus();if(typeof selection==='number'&&typeof $(focusId).setSelectionRange==='function')$(focusId).setSelectionRange(selection,selection); }
}
function renderStatus(){const items=state.tasks.length?state.tasks:[{title:'茶馆已就绪',status:'等待你的需求',done:0,total:0}];statusIndex%=items.length;$('status').innerHTML=items.map((t,i)=>`<div data-status-index="${i}"><span class="dot"></span><span>${escape(t.title)} · ${t.status}${t.total?` ${t.done}/${t.total}`:''}</span></div>`).join('');$('status').scrollTop=statusIndex*32;}
function applyLayout(){const history=$('workspace').querySelector('.history');if(history)history.classList.toggle('auto-hidden',$('workspace').clientWidth<state.width+224+340);}
new ResizeObserver(applyLayout).observe($('workspace'));
function bindResize(){const handle=$('separator');if(!handle)return;handle.onpointerdown=e=>{handle.setPointerCapture(e.pointerId);const start=e.clientX,width=state.width;handle.onpointermove=move=>{state.width=Math.max(280,Math.min(650,width+start-move.clientX));$('workspace').style.setProperty('--workbench-width',state.width+'px');applyLayout();};handle.onpointerup=()=>{handle.onpointermove=null;render();};};handle.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();dispatch({type:'width',value:state.width+(e.key==='ArrowLeft'?20:-20)});}};}
function bindFloat(){const logo=$('float-logo');if(!logo)return;let moved=false;logo.onpointerdown=e=>{logo.setPointerCapture(e.pointerId);moved=false;const startX=e.clientX,startY=e.clientY;logo.onpointermove=move=>{if(Math.abs(move.clientX-startX)+Math.abs(move.clientY-startY)>6)moved=true;if(moved){const rect=$('window').getBoundingClientRect();const y=Math.max(12,Math.min(78,(move.clientY-rect.top)/rect.height*100));state.floatY=y;state.floatSide=move.clientX-rect.left<rect.width/2?'left':'right';logo.style.top=y+'%';logo.style.left=state.floatSide==='left'?'8px':'auto';logo.style.right=state.floatSide==='right'?'8px':'auto';}};logo.onpointerup=()=>{logo.onpointermove=null;if(moved)render();};};logo.onclick=()=>{if(!moved)dispatch({type:'float-open'});};}
function showDialog(body,buttons){lastFocus=document.activeElement;$('dialog-body').innerHTML=body;$('dialog-footer').innerHTML=buttons;$('dialog').showModal();$('dialog').querySelector('input,button,select')?.focus();}
function closeDialog(){$('dialog').close();if(lastFocus?.isConnected)lastFocus.focus();else $('home').focus();}
function showGuide(){const steps=[['欢迎来到茶馆','素材都在「素材库」。中央 Logo 返回助手。'],['配置 AI 服务','在设置里配置服务和模型；导入本身无需模型。'],['开始整理','拖入文件会先成为附件，检查具体计划后再导入。']];const step=steps[guideIndex];showDialog(`<span class="guide-dots">${guideIndex+1} / 3</span><h2>${step[0]}</h2><p>${step[1]}</p>`,`<button data-action="skip-guide">跳过引导</button><button data-action="next-guide" class="primary">${guideIndex===2?'进入助手':'下一步'}</button>`);}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.nav){dispatch({type:'nav',page:b.dataset.nav});return;}if(b.dataset.select){dispatch({type:'select',id:Number(b.dataset.select)});return;}if(b.dataset.cancel){dispatch({type:'cancel',id:Number(b.dataset.cancel)});return;}
  if(b.dataset.scenario){state=Model.initial();selectedWalkthrough=b.dataset.scenario;walkthroughIndex=0;render();return;}
  const a=b.dataset.action;
  if(b.dataset.navMove){dispatch({type:'move-nav',key:b.dataset.navMove,direction:Number(b.dataset.direction)});return;}
  if(a==='handoff'&&!state.standalone.plan?.approved){const c=current();if(c.attachments.length||c.plan||c.draft||c.messages.length||c.selection?.length||state.tasks.some(t=>t.conversation===c.id)){showDialog('<h2>当前对话已有工作</h2><p>原附件、计划和任务会保留。是否新建对话接收这份入库清单？</p>','<button data-action="close-dialog">取消交接</button><button data-action="handoff-new" class="primary">新建对话并交接</button>');return;}}
  if(a==='handoff-new'){closeDialog();dispatch({type:'handoff',newConversation:true});return;}
  if(a==='walk-next'){const step=walkthroughs[selectedWalkthrough]?.[walkthroughIndex];if(step){walkthroughIndex++;dispatch(step[1]);}return;}
  if(['new','history','import','prepare','approve','advance','stop-reasoning','handoff','tagging','result','exit-result','view-search','search-assets','library-handoff','review','show-archive','archive','delete-chat'].includes(a)){if(['archive','delete-chat'].includes(a))closeDialog();dispatch({type:a});return;}
  if(a==='preview'){state.conversations.find(c=>c.id===state.active).workbench='preview';render();}
  if(a==='single'||a==='list')dispatch({type:'view',value:a});
  if(a==='demo-attach')dispatch({type:'attach',names:['照片 01.jpg','照片 02.jpg']});
  if(a==='pick')showDialog('<h2>添加附件</h2><p>原型使用演示文件，不读取真实文件内容。</p>','<button data-action="close-dialog">取消</button><button data-action="attach-confirm" class="primary">添加两张演示照片</button>');
  if(a==='attach-confirm'){closeDialog();dispatch({type:'attach',names:['照片 01.jpg','照片 02.jpg']});}
  if(a==='chat-menu')showDialog(`<h2>管理对话</h2><label class="field">名称<input id="chat-name" value="${escape(current().title)}"></label>`,'<button data-action="request-delete-chat">删除对话</button><button data-action="archive">归档／恢复</button><button data-action="save-name" class="primary">保存名称</button>');
  if(a==='request-delete-chat'){closeDialog();showDialog('<h2>删除这段对话？</h2><p>只删除演示对话，不删除素材和任务结果。尚有未结束任务时无法删除。</p>','<button data-action="close-dialog">保留对话</button><button data-action="delete-chat" class="primary">确认删除对话</button>');}
  if(a==='save-name'){const title=$('chat-name').value;closeDialog();dispatch({type:'rename-chat',title});}
  if(a==='close-dialog'||a==='skip-guide')closeDialog();
  if(a==='next-guide'){closeDialog();if(guideIndex<2){guideIndex++;showGuide();}else dispatch({type:'nav',page:'assistant'});}
  if(a==='float-close'){state.floatOpen=false;render();}
  if(a==='float-new'){dispatch({type:'new'});state.floatOpen=true;render();}
  if(a==='float-send'){const text=$('float-message').value;dispatch({type:'send',text});}
  if(a==='manual-import')dispatch({type:'manual-plan'});
  if(a==='manual-approve')dispatch({type:'manual-approve'});
  if(a==='tag-next'||a==='confirm-tags')dispatch({type:a});
});
document.addEventListener('change',e=>{if(e.target.dataset.asset)dispatch({type:'select-asset',id:Number(e.target.dataset.asset)});if(e.target.id==='service')dispatch({type:'service',value:e.target.value});if(e.target.id==='collection')dispatch({type:'collection',value:e.target.value});if(e.target.id==='rename-option')dispatch({type:'rename-option',value:e.target.checked});if(e.target.id==='float-enabled')dispatch({type:'toggle-float',value:e.target.checked});if(e.target.dataset.navToggle)dispatch({type:'toggle-nav',key:e.target.dataset.navToggle});});
document.addEventListener('input',e=>{if(e.target.id==='history-search')dispatch({type:'search',text:e.target.value});if(e.target.id==='message')state=Model.reduce(state,{type:'draft',text:e.target.value});if(e.target.id==='review-tags')state=Model.reduce(state,{type:'tag-edit',value:e.target.value});});
document.addEventListener('submit',e=>{if(e.target.id==='composer'){e.preventDefault();dispatch({type:'send',text:$('message').value});}});
$('home').onclick=()=>dispatch({type:'nav',page:'assistant'});$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').textContent=dark?'切换浅色':'切换深色';};$('guide').onclick=()=>{guideIndex=0;showGuide();};
$('app-mode').onclick=()=>document.body.classList.add('app-mode');$('show-demo').onclick=()=>document.body.classList.remove('app-mode');
$('status').onmouseenter=()=>statusPaused=true;$('status').onmouseleave=()=>statusPaused=false;$('status').onfocus=()=>statusPaused=true;$('status').onblur=()=>statusPaused=false;
setInterval(()=>{if(!statusPaused&&!matchMedia('(prefers-reduced-motion: reduce)').matches){statusIndex++;renderStatus();}},4500);
$('workspace').ondragover=e=>e.preventDefault();$('workspace').ondrop=e=>{e.preventDefault();if(state.page==='assistant')dispatch({type:'attach',names:Array.from(e.dataTransfer.files,f=>f.name)});};
$('dialog').onclose=()=>{if(lastFocus?.isConnected)lastFocus.focus();};render();
</script></body></html>
